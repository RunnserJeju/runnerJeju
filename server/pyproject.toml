[project]
name = "runner-jeju-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "alembic>=1.13",
    # FastAPI의 UploadFile/Form(코스 GPX 업로드)에 필요하다.
    "python-multipart>=0.0.9",
    # courses.yaml 명단을 읽어 업로드 API로 올리는 tools/push_courses.py용.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
