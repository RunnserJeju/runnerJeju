[project]
name = "runner-jeju-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # [crypto]: 애플 로그인 identityToken(RS256) 서명 검증에 필요.
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
    "alembic>=1.13",
    # FastAPI의 UploadFile/Form(코스 GPX 업로드)에 필요하다.
    "python-multipart>=0.0.9",
    # courses.yaml 명단을 읽어 업로드 API로 올리는 tools/push_courses.py용.
    "pyyaml>=6.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 시나리오 테스트는 Docker의 진짜 Postgres가 필요해서 평소 pytest에서는 뺀다. `pytest -m scenario`로만 돈다.
addopts = "-m 'not scenario'"
markers = ["scenario: 시나리오 테스트 — Docker(Postgres)가 필요하다"]
