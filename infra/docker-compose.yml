services:
  # 로컬 전용 DB. 팀 공유 개발 DB(Supabase 등)에 기본으로 연결하고, 로컬 DB를 띄우지는 않는다. 
  # 오프라인이거나 공유 DB가 죽었을 때만 profile로 켠다:
  #   docker compose --profile local-db up -d db   (뜬 뒤에 api를 올린다 — depends_on 없음)
  db:
    image: postgis/postgis:16-3.4
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      POSTGRES_DB: runner_jeju
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # api가 마이그레이션부터 실행하므로, DB가 "떴다"가 아니라 "쿼리를 받을 수 있다"를
    # 확인해야 한다. 컨테이너 시작만 기다리면 첫 alembic이 연결 거부로 죽는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner -d runner_jeju"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ../server
    environment:
      # 기본값은 local-db 프로필의 로컬 db 컨테이너. 팀 공유 DB(Supabase 등)를 쓰려면 infra/.env 에 DATABASE_URL을 넣는다 (infra/.env.example 참고)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://runner:runner@db:5432/runner_jeju}
      # 배너 이미지 업로드(Supabase Storage)용. infra/.env.example 참고.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_API_SECRET_KEY: ${SUPABASE_API_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-banners}
      # 기본값을 두지 않는다. 없으면 app/config_guard.py가 기동을 거부한다.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    ports:
      - "8000:8000"
    # 개발 편의: 호스트 소스를 그대로 보고 코드 저장 시 리로드한다.
    # 이미지를 그대로 쓰려면(운영과 같은 조건) 아래 volumes와 command를 지우면 된다.
    volumes:
      - ../server:/app
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  db_data:
